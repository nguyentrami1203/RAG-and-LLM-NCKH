<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Amazon Mini - Address</title>
</head>

<body>

    <h1>Your Addresses</h1>

    <h2>Add a New Address</h2>

    <label for="full-name">
        Full Name:
    </label>

    <input
        id="full-name"
        type="text"
        placeholder="Full name"
    >

    <br><br>

    <label for="phone">
        Phone Number:
    </label>

    <input
        id="phone"
        type="text"
        placeholder="Phone number"
    >

    <br><br>

    <label for="street">
        Street Address:
    </label>

    <input
        id="street"
        type="text"
        placeholder="Street address"
    >

    <br><br>

    <label for="city">
        City:
    </label>

    <input
        id="city"
        type="text"
        placeholder="City"
    >

    <br><br>

    <label for="state">
        State:
    </label>

    <select id="state">

        <option value="CA">
            California
        </option>

        <option value="NY">
            New York
        </option>

        <option value="TX">
            Texas
        </option>

    </select>

    <br><br>

    <label for="zip">
        ZIP Code:
    </label>

    <input
        id="zip"
        type="text"
        placeholder="ZIP code"
    >

    <br><br>

    <button id="save-address">
        Add Address
    </button>

</body>

</html>
