<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Amazon Mini - Product</title>
</head>

<body>

    <h1>Sony WH-1000XM5 Headphones</h1>

    <p>
        Wireless noise cancelling headphones
    </p>

    <p>
        Price: $349.99
    </p>

    <label for="color">
        Color:
    </label>

    <select id="color">

        <option value="black">
            Black
        </option>

        <option value="silver">
            Silver
        </option>

    </select>

    <br><br>

    <label for="quantity">
        Quantity:
    </label>

    <select id="quantity">

        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>

    </select>

    <br><br>

    <button id="add-to-cart">
        Add to Cart
    </button>

    <button id="add-to-wishlist">
        Add to Wish List
    </button>

    <button id="buy-now">
        Buy Now
    </button>

</body>

</html>
