<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Amazon Mini - Wish List</title>
</head>

<body>

    <h1>Your Lists</h1>

    <h2>Create a New List</h2>

    <button id="create-list">
        Create a List
    </button>

    <br><br>

    <label for="list-name">
        List Name:
    </label>

    <input
        id="list-name"
        type="text"
        placeholder="Enter list name"
    >

    <br><br>

    <button id="save-list">
        Create List
    </button>

    <hr>

    <h2>My Wish List</h2>

    <p>Sony WH-1000XM5 Headphones</p>

    <button id="remove-wishlist-item">
        Remove Item
    </button>

</body>

</html>
