<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Amazon Mini - Search</title>
</head>

<body>

    <h1>Amazon Mini</h1>

    <h2>Search Products</h2>

    <input
        id="search-box"
        type="text"
        placeholder="Search Amazon Mini"
    >

    <button id="search-button">
        Search
    </button>

    <hr>

    <h2>Search Results</h2>

    <div class="product">

        <h3>Sony WH-1000XM5 Headphones</h3>

        <p>Price: $349.99</p>

        <a href="product.html" id="sony-product-link">
            View Product
        </a>

    </div>

    <hr>

    <div class="product">

        <h3>Logitech MX Keys Keyboard</h3>

        <p>Price: $119.99</p>

        <button id="add-keyboard-cart">
            Add to Cart
        </button>

    </div>

</body>

</html>
