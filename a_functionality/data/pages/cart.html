<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Amazon Mini - Cart</title>
</head>

<body>

    <h1>Shopping Cart</h1>

    <div class="product">

        <h2>Sony WH-1000XM5 Headphones</h2>

        <p>Price: $349.99</p>

        <label for="qty-sony">
            Quantity:
        </label>

        <select id="qty-sony">

            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>

        </select>

        <button id="remove-sony">
            Remove
        </button>

    </div>

    <hr>

    <button id="checkout">
        Proceed to Checkout
    </button>

</body>

</html>
